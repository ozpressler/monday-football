<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Monday Night Football</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211b;--mute:#6b7a72;--line:#e2e8e4;--accent:#0f7b3f;--accent-ink:#fff;--warn:#c2410c;--soft:#e8f3ec}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#18211c;--ink:#e9f0ec;--mute:#93a49a;--line:#26332b;--accent:#2fbf71;--accent-ink:#06210f;--warn:#fb923c;--soft:#1d2b23}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}
main{padding:0 12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mute{color:var(--mute);font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{padding:6px 10px;font-size:14px}button.danger{color:var(--warn)}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
input[type=number]{width:70px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 2px;color:var(--mute);font-size:12px}
nav button.on{color:var(--accent);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}
.pbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:6px}
.score{font-size:40px;font-weight:800;text-align:center;letter-spacing:2px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--soft);border-color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;cursor:pointer;font-size:12px}
tr.clk{cursor:pointer}
.grade{display:inline-block;min-width:38px;text-align:center;font-weight:700;background:var(--soft);border-radius:8px;padding:2px 6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.up{color:var(--accent)}.down{color:var(--warn)}
.clock{font-size:60px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.1}.clock.low{color:var(--warn)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:8}.toast button{background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style>

<body>
<header><h1>⚽ Monday Night Football</h1><span class="mute" id="sub"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"></div>

<script src="config.js"></script>
<script>
'use strict';
/* ---------- data ---------- */
const KEY = 'mondayfootball.v1';
let S = load() || { players: [], nights: [] };
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function localSave() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { alert('Could not save data (storage full or blocked).'); } }
function save() { localSave(); if (cloud.on && cloud.admin) queueSync(); }

/* ---------- shared data (Supabase) ---------- */
const CFG = window.MF_CONFIG || {};
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch { } };
const cloud = { on: !!(CFG.url && CFG.key), group: lsGet('mf.group'), name: '', mode: 'login', form: {}, code: lsGet('mf.code'), authed: false, admin: false, version: 0, status: 'ok', timer: null, syncing: false, dirty: false, err: '' };
const RO = () => cloud.on && cloud.authed && !cloud.admin;
async function rpc(fn, args) {
  const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function queueSync() { lsSet('mf.dirty', '1'); cloud.dirty = true; cloud.status = 'saving'; clearTimeout(cloud.timer); cloud.timer = setTimeout(sync, 500); updateSub(); }
async function sync() {
  if (cloud.syncing) { clearTimeout(cloud.timer); cloud.timer = setTimeout(sync, 500); return; }
  cloud.syncing = true; cloud.dirty = false;
  try {
    const sent = JSON.stringify(S);
    const r = await rpc('save_state', { p_group: cloud.group, p_code: cloud.code, p_data: S, p_version: cloud.version });
    if (r.error === 'conflict') {
      cloud.version = r.version; lsSet('mf.version', String(r.version));
      if (JSON.stringify(r.data) === sent) { cloud.status = 'ok'; if (!cloud.dirty) lsSet('mf.dirty', ''); }   // our own earlier save; nothing lost
      else { S = r.data; localSave(); lsSet('mf.dirty', ''); cloud.status = 'ok'; ui.matchId = null; ui.draft = null; render(); alert('Another device saved newer data, so the latest version was loaded. Please redo your last change.'); }
    } else if (r.error) { cloud.status = 'error'; cloud.err = r.error; }
    else { cloud.version = r.version; lsSet('mf.version', String(r.version)); if (!cloud.dirty) lsSet('mf.dirty', ''); cloud.status = cloud.dirty ? 'saving' : 'ok'; }
  } catch (e) {
    cloud.status = 'error'; cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(sync, 8000);
  }
  cloud.syncing = false; updateSub();
}
async function pull() {
  if (!cloud.on || !cloud.authed || cloud.admin) return;
  try {
    const r = await rpc('get_state', { p_group: cloud.group, p_code: cloud.code });
    if (r.error === 'locked') return;
    if (r.error) return doLogout();
    if (r.version !== cloud.version) { cloud.version = r.version; lsSet('mf.version', String(r.version)); S = r.data; localSave(); render(); }
  } catch { }
}
async function doLogin(group, code, silent) {
  cloud.err = '';
  try {
    const r = await rpc('get_state', { p_group: group, p_code: code });
    if (r.error === 'locked') { cloud.authed = false; cloud.group = group; cloud.err = 'Too many wrong attempts. Try again in a few minutes.'; return render(); }
    if (r.error) { cloud.authed = false; cloud.group = group; cloud.code = ''; lsSet('mf.code', ''); cloud.err = silent ? '' : 'Group name or password is not right.'; return render(); }
    cloud.group = group; cloud.code = code; lsSet('mf.group', group); lsSet('mf.code', code);
    cloud.authed = true; cloud.admin = !!r.admin; cloud.version = r.version; cloud.name = r.name || group;
    lsSet('mf.admin', cloud.admin ? '1' : ''); lsSet('mf.name', cloud.name); lsSet('mf.version', String(cloud.version)); lsSet('mf.dirty', '');
    S = r.data; localSave();
    if (!cloud.admin && !cloud.poll) cloud.poll = setInterval(pull, 20000);
  } catch (e) {
    if (silent && lsGet('mf.name') && lsGet('mf.group') === group) {   // no connection at start-up: open with the saved copy
      cloud.authed = true; cloud.code = code; cloud.admin = lsGet('mf.admin') === '1'; cloud.name = lsGet('mf.name'); cloud.version = +lsGet('mf.version') || 0; cloud.status = 'offline';
      if (cloud.admin) { if (lsGet('mf.dirty')) queueSync(); }
      else if (!cloud.poll) cloud.poll = setInterval(pull, 20000);
    } else { cloud.authed = false; cloud.err = "Can't reach the server. Check your connection and try again."; }
  }
  render();
}
async function doCreate() {
  const v = id => (document.getElementById(id)?.value || '').trim();
  const name = v('gname'), admin = v('gadmin'), admin2 = v('gadmin2'), view = v('gview'), create = v('gcreate');
  cloud.form = { name }; cloud.err = '';
  if (name.length < 2) cloud.err = 'Group name must be at least 2 characters.';
  else if (admin.length < 4 || view.length < 4) cloud.err = 'Passwords must be at least 4 characters.';
  else if (admin !== admin2) cloud.err = 'The two admin passwords do not match.';
  else if (admin === view) cloud.err = 'Admin and viewer passwords must be different.';
  if (cloud.err) return render();
  try {
    const r = await rpc('create_group', { p_name: name, p_view_code: view, p_admin_code: admin, p_create_code: create });
    if (r.error === 'exists') cloud.err = 'That group name is already taken.';
    else if (r.error === 'forbidden') cloud.err = 'Wrong creation code.';
    else if (r.error === 'locked') cloud.err = 'Too many wrong creation codes. Try again in a few minutes.';
    else if (r.error) cloud.err = 'Could not create the group. Check the name and passwords.';
    else { cloud.mode = 'login'; return doLogin(name, admin, false); }
  } catch (e) { cloud.err = "Can't reach the server. Check your connection and try again."; }
  render();
}
function backupNow(label) {
  if (!cloud.on || !cloud.admin || !cloud.authed) return;
  rpc('save_backup', { p_group: cloud.group, p_code: cloud.code, p_label: label, p_data: S }).catch(() => { });
}
async function loadBackups() {
  if (!cloud.on || !cloud.admin || !cloud.authed) return;
  try { const r = await rpc('list_backups', { p_group: cloud.group, p_code: cloud.code }); ui.backups = r.items || []; }
  catch (e) { ui.backups = String(e.message).includes('404') ? 'na' : (ui.backups || []); }
  render();
}
async function doRestore(id) {
  if (!confirm('Restore this backup?\n\nCurrent data will be replaced (a backup of it is saved first).')) return;
  try {
    const r = await rpc('get_backup', { p_group: cloud.group, p_code: cloud.code, p_id: +id });
    if (!r.data) return alert('Could not load that backup.');
    backupNow('Before restoring a backup');
    S = r.data; ui.matchId = null; ui.draft = null; save(); alert('Backup restored.'); setTimeout(loadBackups, 800);
  } catch (e) { alert("Can't reach the server. Check your connection and try again."); }
  render();
}
async function doChangeCodes() {
  const v = id => (document.getElementById(id)?.value || '').trim(), nv = v('newview'), na = v('newadmin');
  if (!nv && !na) return alert('Type a new viewer and/or admin password first.');
  if ((nv && nv.length < 4) || (na && na.length < 4)) return alert('Passwords must be at least 4 characters.');
  if (!confirm('Change the password(s)?\n\nPeople signed in with the old viewer password will need the new one.')) return;
  try {
    const r = await rpc('change_codes', { p_group: cloud.group, p_code: cloud.code, p_new_view: nv, p_new_admin: na });
    if (r.error === 'same') alert('The viewer and admin passwords must be different.');
    else if (r.error) alert('Could not change the passwords.');
    else { if (na) { cloud.code = na; lsSet('mf.code', na); } alert('Passwords changed.'); }
  } catch (e) {
    alert(String(e.message).includes('404') ? 'The database needs updating first. Run supabase-update.sql in Supabase.' : "Can't reach the server. Check your connection and try again.");
  }
  render();
}
async function doRename() {
  const el = document.getElementById('newgname'), nm = (el ? el.value : '').trim();
  if (!nm || nm === cloud.name) return;
  if (nm.length < 2 || nm.length > 40) return alert('The group name must be 2 to 40 characters.');
  if (!confirm(`Rename the group to "${nm}"?\n\nEveryone must use the new name to sign in from now on.`)) return;
  try {
    const r = await rpc('rename_group', { p_group: cloud.group, p_code: cloud.code, p_new_name: nm });
    if (r.error === 'exists') alert('That group name is already taken.');
    else if (r.error) alert('Could not rename the group.');
    else { cloud.group = nm; cloud.name = nm; lsSet('mf.group', nm); }
  } catch (e) {
    alert(String(e.message).includes('404') ? 'The database needs updating first. Run the latest supabase.sql in Supabase.' : "Can't reach the server. Check your connection and try again.");
  }
  render();
}
function doLogout() {
  clearInterval(cloud.poll); cloud.poll = null; clearTimeout(cloud.timer);
  cloud.authed = false; cloud.admin = false; cloud.code = ''; lsSet('mf.code', ''); cloud.name = ''; cloud.mode = 'login'; cloud.err = ''; ['mf.admin', 'mf.name', 'mf.version', 'mf.dirty'].forEach(k => lsSet(k, '')); S = { players: [], nights: [] };
  try { localStorage.removeItem(KEY); } catch { }
  ui.tab = 'night'; ui.draft = null; ui.matchId = null; ui.sheet = null; render();
}
function updateSub() {
  const el = document.getElementById('sub'); if (!el) return;
  if (cloud.on && cloud.authed) el.textContent = (cloud.name ? cloud.name + ' · ' : '') + (RO() ? 'Viewing' : cloud.status === 'offline' ? 'Offline' : cloud.status === 'saving' ? 'Saving…' : cloud.status === 'error' ? '⚠ Not saved – retrying' : 'Saved ✓');
  else el.textContent = activeNight() ? 'Night in progress' : `${finishedNights().length} nights logged`;
}
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toLocaleDateString('en-CA');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r1 = x => Math.round(x * 10) / 10;
const COLORS = [{ n: 'Red', c: '#e5484d' }, { n: 'Blue', c: '#3e63dd' }, { n: 'Yellow', c: '#f5c400' }, { n: 'Green', c: '#30a46c' }];

const P = id => S.players.find(p => p.id === id);
const activePlayers = () => S.players.filter(p => !p.inactive).sort((a, b) => (b.regular ? 1 : 0) - (a.regular ? 1 : 0) || a.name.localeCompare(b.name));
const activeNight = () => S.nights.find(n => !n.finished);
const finishedNights = () => S.nights.filter(n => n.finished).sort((a, b) => (a.date + a.created).localeCompare(b.date + b.created));
const teamOf = (n, id) => n.teams.find(t => t.id === id);
const score = (m, tid) => m.goals.filter(g => g.teamId === tid).length;
const squadOf = (n, m, tid) => (m.squads && m.squads[tid]) || (teamOf(n, tid) ? teamOf(n, tid).playerIds : []);
const playedBy = (n, m, tid) => [...new Set([...squadOf(n, m, tid), ...(m.subs || []).filter(x => x.t === tid).flatMap(x => [x.out, x.in])])];

/* ---------- analysis: stats + grades ---------- */
function analyze(nights) {
  const R = {};
  S.players.forEach(p => R[p.id] = { gp: 0, w: 0, d: 0, l: 0, g: 0, a: 0, gf: 0, ga: 0, nt: 0, wg: 0, ww: 0, wgl: 0, wa: 0, wgd: 0 });
  nights.forEach((n, i) => {
    const wt = Math.pow(0.92, nights.length - 1 - i); // recent nights matter more
    const seen = new Set();
    n.matches.forEach(m => {
      const ta = teamOf(n, m.a), tb = teamOf(n, m.b);
      if (!ta || !tb) return;
      const sa = score(m, m.a), sb = score(m, m.b);
      [[ta, sa, sb], [tb, sb, sa]].forEach(([t, f, c]) => playedBy(n, m, t.id).forEach(pid => {
        const r = R[pid]; if (!r) return;
        r.gp++; r.gf += f; r.ga += c; seen.add(pid);
        if (f > c) r.w++; else if (f === c) r.d++; else r.l++;
        r.wg += wt; r.ww += wt * (f > c ? 1 : f === c ? .5 : 0); r.wgd += wt * (f - c);
      }));
      m.goals.forEach(g => {
        if (g.scorer && R[g.scorer]) { R[g.scorer].g++; R[g.scorer].wgl += wt; }
        if (g.assist && R[g.assist]) { R[g.assist].a++; R[g.assist].wa += wt; }
      });
    });
    seen.forEach(pid => R[pid].nt++);
  });
  const cont = [];
  Object.values(R).forEach(r => { if (r.wg > 0) { r.cpg = (r.wgl + .7 * r.wa) / r.wg; if (r.gp >= 3) cont.push(r.cpg); } });
  cont.sort((a, b) => a - b);
  const ref = Math.max(.8, cont.length ? cont[Math.floor((cont.length - 1) * .9)] : .8);
  S.players.forEach(p => {
    const r = R[p.id], seed = p.seed ?? 5, adj = p.adj || 0;
    let base = seed;
    if (r.wg > 0) {
      const wr = (r.ww + 1) / (r.wg + 2);                       // smoothed win rate
      const cn = clamp(r.cpg / ref, 0, 1);                      // goals+assists per game vs group
      const gdn = clamp(.5 + (r.wgd / r.wg) / 6, 0, 1);         // goal difference while playing
      const g10 = 1 + 9 * (.45 * wr + .30 * cn + .25 * gdn);
      const w = r.wg / (r.wg + 6);                              // trust data more as games pile up
      base = seed * (1 - w) + g10 * w;
    }
    r.grade = clamp(r1(base + adj), 1, 10);
  });
  return R;
}
const grades = () => analyze(finishedNights());

/* ---------- team balancing ---------- */
function balance(ids, k) {
  const G = grades();
  const ps = ids.map(id => ({ id, g: G[id].grade }));
  const cost = teams => {
    const means = teams.map(t => t.length ? t.reduce((s, p) => s + p.g, 0) / t.length : 0);
    const mu = means.reduce((a, b) => a + b, 0) / k;
    return means.reduce((s, m) => s + (m - mu) ** 2, 0) / k * 25;
  };
  const results = [];
  for (let r = 0; r < 40; r++) {
    const sh = ps.slice().sort(() => Math.random() - .5);
    const teams = Array.from({ length: k }, () => []);
    sh.forEach((p, i) => teams[i % k].push(p));
    let cur = cost(teams), improved = true, guard = 0;
    while (improved && guard++ < 60) {
      improved = false;
      for (let a = 0; a < k; a++) for (let b = a + 1; b < k; b++)
        for (let i = 0; i < teams[a].length; i++) for (let j = 0; j < teams[b].length; j++) {
          [teams[a][i], teams[b][j]] = [teams[b][j], teams[a][i]];
          const c = cost(teams);
          if (c < cur - 1e-9) { cur = c; improved = true; } else [teams[a][i], teams[b][j]] = [teams[b][j], teams[a][i]];
        }
    }
    results.push({ c: cur, teams: teams.map(t => t.map(p => p.id)) });
  }
  results.sort((a, b) => a.c - b.c);
  const good = results.filter(x => x.c <= results[0].c + .15);
  return good[Math.floor(Math.random() * good.length)].teams;
}

/* ---------- settings ---------- */
const DEFAULTS = { matchMins: 8, extraMins: 2, extraTied: true, sound: true, teams: 3, perSide: 5, allowSubs: false };
const cfg = () => ({ ...DEFAULTS, ...(S.settings || {}) });

/* ---------- game timer (per device, not shared) ---------- */
let actx = null, wake = null;
function ensureAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch { } }
async function requestWake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch { } }
function releaseWake() { try { wake && wake.release(); } catch { } wake = null; }
function alarm() {
  if (!cfg().sound) return;
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch { }
  try { if (!actx) return; [0, .35, .7].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .25; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .25); }); } catch { }
}
const saveTimer = () => lsSet('mf.timer', ui.timer ? JSON.stringify(ui.timer) : '');
const freshTimer = matchId => ({ matchId, phase: 'main', remaining: cfg().matchMins * 60000, endAt: null, running: false, done: false });
function timerState(matchId) { if (!ui.timer || ui.timer.matchId !== matchId) { ui.timer = freshTimer(matchId); saveTimer(); } return ui.timer; }
const timeLeft = t => t.running ? Math.max(0, t.endAt - Date.now()) : t.remaining;
const fmtClock = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function timerHtml(m) {
  const t = timerState(m.id), left = timeLeft(t), c = cfg();
  const tied = score(m, m.a) === score(m, m.b);
  const full = (t.phase === 'extra' ? c.extraMins : c.matchMins) * 60000;
  let controls, note = '';
  if (t.done) {
    note = `<div style="text-align:center"><b>${t.phase === 'extra' ? 'Full time (after extra time)' : 'Full time'}</b></div>`;
    controls = (t.phase === 'main' && tied && c.extraMins > 0 && c.extraTied ? `<button class="pri sp" data-a="timerExtra">+ ${c.extraMins} min extra time</button>` : '') + '<button data-a="timerReset">Reset</button>';
  } else {
    if (t.phase === 'extra') note = '<div style="text-align:center"><span class="pill">Extra time</span></div>';
    controls = `<button class="pri sp" data-a="timerToggle">${t.running ? 'Pause' : left < full ? 'Resume' : 'Start'}</button><button data-a="timerReset">Reset</button>`;
  }
  return `<div class="card"><div class="clock ${left <= 30000 && !t.done ? 'low' : ''}" id="clock">${fmtClock(left)}</div>${note}<div class="row" style="margin-top:8px">${controls}</div></div>`;
}
setInterval(() => {

function suggestNext(n) {
  const ts = n.teams; if (ts.length < 2) return null;
  if (!n.matches.length) return { a: ts[0].id, b: ts[1].id, why: 'first game' };
  const played = {}, last = {}; ts.forEach(t => { played[t.id] = 0; last[t.id] = -1; });
  n.matches.forEach((m, i) => { if (played[m.a] != null) { played[m.a]++; last[m.a] = i; } if (played[m.b] != null) { played[m.b]++; last[m.b] = i; } });
  const L = n.matches[n.matches.length - 1], nm = id => teamOf(n, id)?.name;
  if (ts.length === 3 && teamOf(n, L.a) && teamOf(n, L.b)) {
    const rest = ts.find(t => t.id !== L.a && t.id !== L.b).id, sa = score(L, L.a), sb = score(L, L.b);
    let stay, why;
    if (sa !== sb) { stay = sa > sb ? L.a : L.b; why = `${nm(stay)} won and stays on`; }
    else { stay = played[L.a] !== played[L.b] ? (played[L.a] > played[L.b] ? L.b : L.a) : L.b; why = `draw, ${nm(stay)} stays on (fewer games)`; }
    return { a: stay, b: rest, why };
  }
  const order = ts.slice().sort((x, y) => played[x.id] - played[y.id] || last[x.id] - last[y.id]);
  return { a: order[0].id, b: order[1].id, why: 'the teams with the fewest games' };
}

/* ---------- share card ---------- */
async function nightCardBlob(n) {
  const W = 1080, pad = 56, ms = n.matches;
  const scorers = m => { const c = {}; goalsSorted(m).forEach(g => { if (g.scorer && P(g.scorer)) c[g.scorer] = (c[g.scorer] || 0) + 1; }); return Object.entries(c).map(([id, k]) => P(id).name + (k > 1 ? ' ×' + k : '')).join(', '); };
  const tot = {}; ms.forEach(m => m.goals.forEach(g => { if (g.scorer && P(g.scorer)) tot[g.scorer] = (tot[g.scorer] || 0) + 1; if (g.assist && P(g.assist)) tot[g.assist] = (tot[g.assist] || 0) + .001; }));
  const star = Object.entries(tot).sort((a, b) => b[1] - a[1])[0];
  const rowH = 150, H = 250 + ms.length * rowH + (star ? 130 : 40);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
  x.fillStyle = '#0f7b3f'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  x.font = '700 58px system-ui, sans-serif'; x.fillText('⚽ Monday Night Football', pad, 100);
  x.font = '400 36px system-ui, sans-serif'; x.globalAlpha = .85; x.fillText((cloud.name ? cloud.name + ' · ' : '') + n.date, pad, 152); x.globalAlpha = 1;
  const fit = (t, w) => { while (x.measureText(t).width > w && t.length > 3) t = t.slice(0, -2); return t; };
  ms.forEach((m, i) => {
    const y = 190 + i * rowH, ta = teamOf(n, m.a), tb = teamOf(n, m.b); if (!ta || !tb) return;
    x.fillStyle = 'rgba(255,255,255,.96)'; x.beginPath(); x.roundRect ? x.roundRect(pad, y, W - 2 * pad, rowH - 18, 22) : x.rect(pad, y, W - 2 * pad, rowH - 18); x.fill();
    x.fillStyle = ta.color; x.beginPath(); x.arc(pad + 40, y + 48, 16, 0, 7); x.fill();
    x.fillStyle = tb.color; x.beginPath(); x.arc(W - pad - 40, y + 48, 16, 0, 7); x.fill();
    x.fillStyle = '#16211b'; x.font = '700 44px system-ui, sans-serif'; x.textAlign = 'center';
    x.fillText(`${ta.name}  ${score(m, m.a)} – ${score(m, m.b)}  ${tb.name}`, W / 2, y + 62);
    x.font = '400 28px system-ui, sans-serif'; x.fillStyle = '#56645c'; x.fillText(fit(scorers(m) || 'No goals', W - 2 * pad - 60), W / 2, y + 108);
    x.textAlign = 'left';
  });
  if (star) {
    const y = 190 + ms.length * rowH + 20; x.fillStyle = '#fff'; x.font = '600 38px system-ui, sans-serif';
    x.fillText(`⭐ Star of the night: ${P(star[0]).name} (${Math.floor(star[1])} goal${Math.floor(star[1]) === 1 ? '' : 's'})`, pad, y + 40);
  }
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
async function shareNight(nid) {

  const blob = await nightCardBlob(n), file = new File([blob], `night-${n.date}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Monday Night Football' }); return; } catch (e) { if (e.name === 'AbortError') return; } }

  nights.forEach(n => n.matches.forEach(m => {
    const ta = teamOf(n, m.a), tb = teamOf(n, m.b); if (!ta || !tb) return;
    const sa = score(m, m.a), sb = score(m, m.b);
    [[ta, sa, sb], [tb, sb, sa]].forEach(([t, f, c]) => playedBy(n, m, t.id).forEach(pid => { if (Q[pid]) Q[pid].push({ r: f > c ? 'W' : f === c ? 'D' : 'L', date: n.date }); }));

}
function streakOf(seq, ch) {

  const T = {};

    const ta = teamOf(n, m.a), tb = teamOf(n, m.b); if (!ta || !tb) return;
    const sa = score(m, m.a), sb = score(m, m.b);
    [[ta, sa, sb], [tb, sb, sa]].forEach(([t, f, c]) => {
      const sq = playedBy(n, m, t.id); if (!sq.includes(pid)) return;
      sq.forEach(q => { if (q === pid) return; const e = T[q] || (T[q] = { gp: 0, w: 0, d: 0 }); e.gp++; if (f > c) e.w++; else if (f === c) e.d++; });
    });
  }));
  return Object.entries(T).filter(([q, e]) => e.gp >= 4 && P(q)).map(([q, e]) => ({ id: q, gp: e.gp, wr: (e.w + e.d / 2) / e.gp })).sort((x, y) => y.wr - x.wr || y.gp - x.gp);
}
function awardsHtml(nights) {

    const rows = ps.filter(p => ok(R[p.id], p) && val(p) > min).sort((x, y) => val(y) - val(x)).slice(0, 3);
    if (!rows.length) return '';
    return `<div class="card"><b>${label}</b>${rows.map((p, i) => `<div class="row" style="padding:4px 0"><span>${['🥇', '🥈', '🥉'][i]}</span><span class="sp">${esc(p.name)}</span><b>${fmt(val(p))}</b></div>`).join('')}</div>`;
  };
  const wr = p => (R[p.id].w + R[p.id].d / 2) / R[p.id].gp;
  let improved = '';
  if (all.length >= 5) {
    const before = analyze(all.slice(0, -3));
    improved = top('📈 Most improved (last 3 nights)', p => before[p.id].gp > 0 ? G[p.id].grade - before[p.id].grade : 0, v => '+' + v.toFixed(1), () => true, 0.05);
  }
  return [
    top('🥇 Top scorers', p => R[p.id].g, v => v),
    top('🎯 Top assisters', p => R[p.id].a, v => v),
    top('🔥 Goal involvements per game', p => (R[p.id].g + R[p.id].a) / R[p.id].gp, v => v.toFixed(2), r => r.gp >= 4),
    top('🏆 Best win rate (6+ games)', wr, v => Math.round(v * 100) + '%', r => r.gp >= 6),
    top('🛡️ Best goal difference per game (6+ games)', p => (R[p.id].gf - R[p.id].ga) / R[p.id].gp, v => (v > 0 ? '+' : '') + v.toFixed(2), r => r.gp >= 6),
    top('📅 Most nights played', p => R[p.id].nt, v => v),
    top('⭐ Highest grades', p => G[p.id].grade, v => v.toFixed(1)),
    improved,
    top('⚡ Longest win streaks', p => streakOf(Q[p.id], 'W').best, v => v + ' wins', () => true, 1),
    top('🔥 On a winning streak now', p => streakOf(Q[p.id], 'W').now, v => v + ' wins', () => true, 1),
    top('🥶 Longest losing streaks', p => streakOf(Q[p.id], 'L').best, v => v + ' losses', () => true, 1),

}
function chartsHtml(nights, R, ps) {
  const last = nights.slice(-12); if (!last.length) return '';
  const vals = last.map(n => n.matches.reduce((t, m) => t + m.goals.length, 0));
  const W = 320, H = 130, bw = W / last.length, mx = Math.max(...vals, 1);
  const bars = vals.map((v, i) => {
    const h = v / mx * (H - 34), x = i * bw, y = H - 16 - h;
    return `<rect x="${(x + 3).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--accent)"/>
      <text x="${(x + bw / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="10" text-anchor="middle" fill="var(--mute)">${v}</text>
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 3}" font-size="8" text-anchor="middle" fill="var(--mute)">${esc(last[i].date.slice(5))}</text>`;
  }).join('');
  const tops = ps.map(p => ({ p, g: R[p.id].g, a: R[p.id].a })).filter(x => x.g + x.a > 0).sort((x, y) => (y.g + y.a) - (x.g + x.a)).slice(0, 6);
  const mx2 = Math.max(...tops.map(x => x.g + x.a), 1);

      <div class="sp" style="display:flex;height:16px"><div style="width:${x.g / mx2 * 100}%;background:var(--accent);border-radius:4px 0 0 4px"></div><div style="width:${x.a / mx2 * 100}%;background:var(--mute);opacity:.6;border-radius:0 4px 4px 0"></div></div><span class="mute" style="width:52px;text-align:right">${x.g}+${x.a}</span></div>`).join('');
  return `<div class="card"><b>Goals per night</b><svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg></div>
    ${tops.length ? `<div class="card"><b>Goals + assists</b> <span class="mute">(goals · assists)</span>${hb}</div>` : ''}`;
}
function viewStats() {
  const tabs = `<div class="tabs"><button class="${ui.view === 'players' ? 'on' : ''}" data-a="view" data-k="players">Players</button><button class="${ui.view === 'awards' ? 'on' : ''}" data-a="view" data-k="awards">Awards</button><button class="${ui.view === 'nights' ? 'on' : ''}" data-a="view" data-k="nights">Nights</button></div>`;

      <td>${r.gp ? Math.round((r.w + r.d / 2) / r.gp * 100) + '%' : '–'}</td><td>${r.g}</td><td>${r.a}</td><td>${r.g + r.a}</td><td>${r.gp ? ((r.g + r.a) / r.gp).toFixed(2) : '–'}</td></tr>`; }).join('')}</table></div>
    <p class="mute">Grade is always all-time. The other columns follow the period above. Win% counts a draw as half a win. Tap a player for details.</p>`;

function sheetHtml() {
  const s = ui.sheet;
  if (s.type === 'assist') {
    const n = activeNight(), t = teamOf(n, s.teamId);
    return `<h2 style="margin-top:0">Assist by?</h2><p class="mute">${s.scorer ? esc(P(s.scorer).name) + ' scored' : 'Goal'}</p>
      ${squadOf(n, n.matches.find(x => x.id === ui.matchId), s.teamId).filter(id => id !== s.scorer).map(id => `<button class="pbtn" data-a="assist" data-p="${id}">${esc(P(id)?.name)}</button>`).join('')}

  }
  if (s.type === 'finish') {
    return `<h2 style="margin-top:0">Night saved ✅</h2><p class="mute">Grades updated:</p>
      ${s.changes.length ? s.changes.map(c => `<div class="row" style="padding:5px 0"><span class="sp">${esc(c.name)}</span><span class="mute">${c.from.toFixed(1)} →</span><span class="grade">${c.to.toFixed(1)}</span>

  install: () => { const e = ui.installEvt; ui.installEvt = null; if (e) e.prompt(); },
  hideHint: () => { lsSet('mf.hint', '1'); },
  editTeams: () => { ui.draft = draftFromNight(activeNight()); },
  cancelDraft: () => { ui.draft = null; },
  tickRegulars: () => { activePlayers().filter(p => p.regular).forEach(p => ui.draft.att[p.id] = true); },
  assign: d => { const a = ui.draft.assign; if (cfg().allowSubs && a[d.p] === +d.i) delete a[d.p]; else a[d.p] = +d.i; },
  quickAdd: () => { const el = document.getElementById('quick'); const nm = el.value.trim(); if (!nm) return; const p = newPlayer(nm); ui.draft.att[p.id] = true; save(); },
  autoBalance: () => {
    const d = ui.draft, subs = cfg().allowSubs, need = d.k * cfg().perSide;
    let ids = activePlayers().filter(p => d.att[p.id]).map(p => p.id);
    if (subs ? ids.length < need : ids.length !== need) return alert(`You need ${subs ? 'at least' : 'exactly'} ${need} players (${d.k} teams of ${cfg().perSide}).`);
    if (ids.length > need) ids = ids.map(id => ({ id, k: Math.random() + (P(id).regular ? .5 : 0) })).sort((a, b) => b.k - a.k).slice(0, need).map(x => x.id);
    const teams = balance(ids, d.k);
    d.assign = {}; teams.forEach((t, i) => t.forEach(id => d.assign[id] = i));
  },
  beginNight: () => {
    const d = ui.draft, ids = activePlayers().filter(p => d.att[p.id]).map(p => p.id);
    const per = cfg().perSide;
    const subs = cfg().allowSubs;
    if (subs ? ids.length < d.k * per : ids.length !== d.k * per) return alert(`You need ${subs ? 'at least' : 'exactly'} ${d.k * per} players (${d.k} teams of ${per}) to start.`);
    if (Array.from({ length: d.k }, (_, i) => ids.filter(id => d.assign[id] === i).length).some(n => n !== per)) return alert(`Each team needs exactly ${per} players.`);
    if (!subs && ids.some(id => d.assign[id] == null)) return alert('Some players are not on a team yet. Tap a colour for each player, or use Auto-balance.');
    const teams = Array.from({ length: d.k }, (_, i) => ({ id: uid(), name: COLORS[i].n, color: COLORS[i].c, playerIds: ids.filter(id => d.assign[id] === i) })).filter(t => t.playerIds.length);
    if (teams.length < 2) return alert('You need at least two teams with players.');
    if (d.edit) {
      const n = S.nights.find(x => x.id === d.edit);
      // keep team ids stable where the colour matches so existing games stay linked
      const old = n.teams; teams.forEach(t => { const o = old.find(x => x.name === t.name); if (o) t.id = o.id; });
      n.teams = teams; n.date = d.date; n.bench = ids.filter(id => d.assign[id] == null);
      n.matches = n.matches.filter(m => teamOf(n, m.a) && teamOf(n, m.b));
      n.matches.forEach(m => m.goals = m.goals.filter(g => teamOf(n, g.teamId)));
    } else S.nights.push({ id: uid(), date: d.date, created: String(Date.now()), teams, bench: ids.filter(id => d.assign[id] == null), matches: [], finished: false });
    ui.draft = null; ui.nm = {}; save();
  },
  newMatch: () => {
    const n = activeNight(), a = document.getElementById('nmA').value, b = document.getElementById('nmB').value;
    if (a === b) return alert('Pick two different teams.');
    const m = { id: uid(), a, b, goals: [] }; n.matches.push(m); ui.matchId = m.id; ui.nm = {}; save();
  },
  openMatch: d => { ui.matchId = d.id; },
  closeMatch: () => { ui.matchId = null; },
  timerToggle: () => {
    const t = timerState(ui.matchId);
    if (t.running) { t.remaining = timeLeft(t); t.endAt = null; t.running = false; releaseWake(); }
    else if (!t.done) { ensureAudio(); t.endAt = Date.now() + t.remaining; t.running = true; requestWake(); }
    saveTimer();
  },
  timerReset: () => { ui.timer = freshTimer(ui.matchId); releaseWake(); saveTimer(); },
  timerExtra: () => {
    const t = timerState(ui.matchId); ensureAudio();
    t.phase = 'extra'; t.done = false; t.remaining = cfg().extraMins * 60000; t.endAt = Date.now() + t.remaining; t.running = true; requestWake(); saveTimer();
  },
  resetSettings: () => { delete S.settings; ui.timer = null; saveTimer(); save(); },
  saveMatch: () => { const m = activeNight().matches.find(x => x.id === ui.matchId); m.saved = true; if (ui.timer && ui.timer.running) { ui.timer.remaining = timeLeft(ui.timer); ui.timer.endAt = null; ui.timer.running = false; releaseWake(); saveTimer(); } ui.matchId = null; save(); },
  delMatch: () => { if (!confirm('Delete this game?')) return; const n = activeNight(); n.matches = n.matches.filter(m => m.id !== ui.matchId); ui.matchId = null; save(); },
  goal: d => { ui.sheet = { type: 'assist', teamId: d.team, scorer: d.p || null }; },
  assist: d => {
    const n = activeNight(), m = n.matches.find(x => x.id === ui.matchId), s = ui.sheet;
    const g = { id: uid(), teamId: s.teamId, scorer: s.scorer, assist: d.p || null, min: curMinute(m) };
    m.goals.push(g); m.saved = false; ui.sheet = null; save();
    ui.toast = { gid: g.id, text: `⚽ ${s.scorer ? P(s.scorer)?.name : 'Goal'} scored${d.p ? ` · assist ${P(d.p)?.name}` : ''}` };
    setTimeout(() => { if (ui.toast && ui.toast.gid === g.id) { ui.toast = null; render(); } }, 7000);
  },
  undoGoal: () => {
    const t = ui.toast; ui.toast = null; if (!t) return;
    const n = activeNight(), m = n && n.matches.find(x => x.id === ui.matchId); if (!m) return;
    m.goals = m.goals.filter(g => g.id !== t.gid); m.saved = false; save();
  },
  subStart: d => { ui.sheet = { type: 'subOut', teamId: d.team }; },
  subOut: d => { ui.sheet = { type: 'subIn', teamId: ui.sheet.teamId, out: d.p }; },
  subIn: d => {
    const n = activeNight(), m = n.matches.find(x => x.id === ui.matchId), s = ui.sheet;
    if (!m.squads) m.squads = { [m.a]: squadOf(n, m, m.a).slice(), [m.b]: squadOf(n, m, m.b).slice() };
    m.squads[s.teamId] = m.squads[s.teamId].map(id => id === s.out ? d.p : id);
    (m.subs = m.subs || []).push({ t: s.teamId, out: s.out, in: d.p });
    m.saved = false; ui.sheet = null; save();
  },
  editGoalTime: d => { ui.sheet = { type: 'goalTime', gid: d.id }; },
  saveGoalTime: () => {
    const m = activeNight().matches.find(x => x.id === ui.matchId), g = m.goals.find(x => x.id === ui.sheet.gid);
    const v = parseInt(document.getElementById('gmin').value, 10);
    g.min = Number.isNaN(v) ? null : clamp(v, 1, 120); m.saved = false; ui.sheet = null; save();
  },
  clearGoalTime: () => {
    const m = activeNight().matches.find(x => x.id === ui.matchId), g = m.goals.find(x => x.id === ui.sheet.gid);
    g.min = null; m.saved = false; ui.sheet = null; save();
  },
  delGoal: d => { const m = activeNight().matches.find(x => x.id === ui.matchId); m.goals = m.goals.filter(g => g.id !== d.id); m.saved = false; save(); },
  discardNight: () => { if (!confirm('Discard tonight completely? All games will be lost.')) return; backupNow('Before discarding a night'); S.nights = S.nights.filter(n => n.finished); ui.matchId = null; save(); },
  finishNight: () => {
    const n = activeNight();
    if (!confirm(`Finish the night (${n.matches.length} games) and update grades?`)) return;
    const before = grades(); n.finished = true; n.matches.forEach(m => m.saved = true); save(); backupNow(`After night ${n.date}`); const after = grades();
    const changes = S.players.filter(p => n.teams.some(t => t.playerIds.includes(p.id)))
      .map(p => ({ name: p.name, from: before[p.id].grade, to: after[p.id].grade })).sort((a, b) => (b.to - b.from) - (a.to - a.from));
    ui.sheet = { type: 'finish', changes, nid: n.id }; ui.matchId = null;
  },
  reopen: d => {
    if (activeNight()) return alert('Finish or discard tonight\'s night first.');
    S.nights.find(n => n.id === d.id).finished = false; ui.tab = 'night'; save();
  },
  addPlayer: () => { const el = document.getElementById('newName'); if (el.value.trim()) { newPlayer(el.value.trim()); save(); } },
  bulkAdd: () => { document.getElementById('bulk').value.split(/[\n,]/).map(s => s.trim()).filter(Boolean).forEach(newPlayer); save(); },
  deletePlayer: d => {
    const p = P(d.p); if (!p) return;
    const games = analyze(finishedNights())[p.id].gp;
    if (!confirm(`Permanently delete ${p.name}?\n\nTheir name, grade and stats are removed (${games} game${games === 1 ? '' : 's'} played). Game scores stay the same, but their goals and assists show as "unknown". You can restore a backup afterwards.\n\nTip: "Retire" hides a player but keeps their history.`)) return;
    backupNow(`Before deleting ${p.name}`);
    S.players = S.players.filter(x => x.id !== p.id);
    S.nights.forEach(n => {
      n.teams.forEach(t => t.playerIds = t.playerIds.filter(id => id !== p.id));
      n.matches.forEach(m => { m.goals.forEach(g => { if (g.scorer === p.id) g.scorer = null; if (g.assist === p.id) g.assist = null; }); if (m.squads) Object.keys(m.squads).forEach(k => m.squads[k] = m.squads[k].filter(id => id !== p.id)); });
      if (n.bench) n.bench = n.bench.filter(id => id !== p.id);
    });
    if (ui.draft) { delete ui.draft.att[p.id]; delete ui.draft.assign[p.id]; }
    ui.sheet = null; save();
  },
  toggleActive: d => { const p = P(d.p); p.inactive = !p.inactive; save(); },
  export: () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `monday-night-football-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  importPick: () => document.getElementById('file').click(),
  demo: () => { if (!confirm('This REPLACES all current data with demo data (20 players, 6 nights). Continue?')) return; backupNow('Before loading demo data'); S = { ...makeDemo(), settings: S.settings }; ui.tab = 'stats'; save(); },
  wipe: () => { if (confirm('Delete ALL players and games?') && confirm('Really delete everything? (A backup is saved first when you are online.)')) { backupNow('Before deleting all data'); S = { players: [], nights: [], settings: S.settings }; save(); } },
};
function makeDemo() {
  const names = ['Alex', 'Ben', 'Chris', 'Dan', 'Eli', 'Fabio', 'Gil', 'Hugo', 'Ivan', 'Jack', 'Kai', 'Leo', 'Marco', 'Nico', 'Omar', 'Pablo', 'Quinn', 'Raul', 'Sam', 'Tom'];
  const skill = [8, 7, 6.5, 6, 5.5, 5, 7.5, 4.5, 6, 5, 4, 3.5, 6.5, 5.5, 3, 6, 4.5, 5.5, 4, 5];
  const players = names.map((n, i) => ({ id: uid(), name: n, seed: 5, adj: 0, regular: i < 14 }));
  const sk = {}; players.forEach((p, i) => sk[p.id] = skill[i]);
  const pois = l => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
  const pick = (ids, pow) => { const w = ids.map(id => sk[id] ** pow), tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot; for (let i = 0; i < ids.length; i++) { r -= w[i]; if (r <= 0) return ids[i]; } return ids[ids.length - 1]; };
  const nights = [];
  for (let w = 6; w >= 1; w--) {
    const d = new Date(); d.setDate(d.getDate() - 7 * w);
    const shuffled = players.map(p => ({ id: p.id, k: Math.random() + (p.regular ? .35 : 0) })).sort((a, b) => b.k - a.k).slice(0, 15).map(x => x.id).sort(() => Math.random() - .5);
    const teams = [0, 1, 2].map(i => ({ id: uid(), name: COLORS[i].n, color: COLORS[i].c, playerIds: shuffled.filter((_, j) => j % 3 === i) }));
    const mean = t => t.playerIds.reduce((s, id) => s + sk[id], 0) / t.playerIds.length;
    const matches = [[0, 1], [1, 2], [0, 2], [0, 1], [1, 2], [0, 2]].map(([a, b]) => {
      const goals = [];
      [[teams[a], teams[b]], [teams[b], teams[a]]].forEach(([t, o]) => {
        const n = pois(clamp(2 + (mean(t) - mean(o)) * .3, .6, 4));
        for (let k = 0; k < n; k++) {
          const scorer = pick(t.playerIds, 2);
          const assist = Math.random() < .65 ? pick(t.playerIds.filter(id => id !== scorer), 1) : null;
          goals.push({ id: uid(), teamId: t.id, scorer, assist, min: 1 + Math.floor(Math.random() * 8) });
        }
      });
      return { id: uid(), a: teams[a].id, b: teams[b].id, goals };
    });
    nights.push({ id: uid(), date: d.toLocaleDateString('en-CA'), created: String(d.getTime()), teams, matches, finished: true });
  }
  return { players, nights };
}
function newPlayer(name) { const p = { id: uid(), name, seed: 5, adj: 0 }; S.players.push(p); return p; }

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a]')) return;
  const t = e.target.closest('[data-a]'); if (!t) return;
  const f = A[t.dataset.a]; if (!f) return;
  if (cloud.on && (!cloud.authed || RO()) && !['tab', 'view', 'sort', 'player', 'closeSheet', 'login', 'logout', 'showCreate', 'showLogin', 'createGroup', 'range', 'shareNight', 'hideHint', 'install'].includes(t.dataset.a)) return;
  f(t.dataset); render();
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.c; if (!c) {
    if (t.id === 'file' && t.files[0]) {
      t.files[0].text().then(txt => {
        try { const j = JSON.parse(txt); if (!Array.isArray(j.players) || !Array.isArray(j.nights)) throw 0;
          if (confirm('Replace current data with this backup?')) { backupNow('Before importing a file'); S = j; save(); render(); } } catch { alert('That file is not a valid backup.'); }
      });
    } return;
  }
  const d = ui.draft, p = t.dataset.p && P(t.dataset.p);
  if (c === 'att') { d.att[t.dataset.p] = t.checked; if (!t.checked) delete d.assign[t.dataset.p]; }
  else if (c === 'ddate') d.date = t.value || today();
  else if (c === 'dk') { d.k = +t.value; Object.keys(d.assign).forEach(k => { if (d.assign[k] >= d.k) delete d.assign[k]; }); }
  else if (c === 'nm') ui.nm = { a: document.getElementById('nmA').value, b: document.getElementById('nmB').value, at: activeNight().matches.length };
  else if (c === 'set') {
    const k = t.dataset.k, def = DEFAULTS[k];
    const v = t.type === 'checkbox' ? t.checked : clamp(Math.round(parseFloat(t.value)), +t.dataset.min, +t.dataset.max);
    S.settings = { ...cfg(), [k]: Number.isNaN(v) ? def : v };
    if (!ui.timer || !ui.timer.running) { ui.timer = null; saveTimer(); }
    save();
  }
  else if (c === 'pname') { if (t.value.trim()) p.name = t.value.trim(); save(); }
  else if (c === 'preg') { p.regular = t.checked; save(); }
  else if (c === 'pseed') { p.seed = clamp(+t.value || 5, 1, 10); save(); }
  else if (c === 'padj') { p.adj = clamp(+t.value || 0, -3, 3); save(); }
  render();
});

if (cloud.on) { render(); if (cloud.group) doLogin(cloud.group, cloud.code, true); } else render();
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'code' || e.target.id === 'grp')) A.login(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
